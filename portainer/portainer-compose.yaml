services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:2.45.1   # 11/2: 팀 기준 버전으로 고정(sts는 움직이는 꼬리표라 새로 받으면 다른 버전이 됨)
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - 9443:9443
      - 8000:8000  # Remove if you do not intend to use Edge Agents

volumes:
  portainer_data:
    name: portainer_data

networks:
  default:
    name: portainer_network