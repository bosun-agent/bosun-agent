agents:
  root:
    hooks:
      # 실행 줄의 -X utf8: Windows에서 한글이 CP949로 처리되는 문제 방지(Mac·Linux에도 무해). Windows는 python3 대신 python일 수 있다.

      # 1) 정책(허용 목록) → 2) 삭제 전 백업 순서로 실행. 둘 다 on_error: block 필수
      #    훅이 실패하면 docker_proxy 호출은 조회까지 모두 막힌다(안전 쪽). 훅 고장은 즉시 고친다.
      # 승인 카드 설명(11/1) — 실행될 요청을 쉬운 말로 설명해 승인 카드에 붙인다(metadata.reason·blast_radius).
      #    허용·거부 판정은 하지 않는다. tool_guard는 훅 오류면 호출을 거부하므로 훅 안에서 모든 오류를 잡는다
      tool_guard:
        - matcher: "*"
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_guard_approval_explainer.py
              timeout: 10
              env:
                AGENT_ENV_FILE: /실행폴더/agent.env   # 11/1: Portainer 조회(컨테이너 ID 고정·이름 표시)
                PORTAINER_TLS_VERIFY: "0"
                SOTERIA_TARGETS_FILE: /실행폴더/soteria_targets.json
                SOTERIA_ENDPOINT_ID: "3"
                SOTERIA_RECORD: /실행폴더/soteria_runs.jsonl
            # 11/17 사용자 정책 훅(tool_guard_user_policy.py) 등록 해제 — 정책 보드는 '자유롭게 조정'(시원 님 결정).
            #    웹 정책 보드가 이 설정 파일의 permissions(allow·ask·deny)를 직접 고쳐 쓰므로 그것 하나만 기준으로 둔다.
            #    허용으로 옮긴 작업은 승인 카드 없이 실행되지만, 정책 훅의 조건 검사와 DENY(금지 경로·보호 대상)는 그대로다.

      tool_input_transform:
        - matcher: "docker_proxy"
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_input_transform_direct_policy_guard.py
              timeout: 150 # 11/13: 볼륨을 지우기 전 백업 창구에서 떼는(다시 배포) 시간
              on_error: block
              env:
                AGENT_ENV_FILE: /실행폴더/agent.env   # 11/1: Portainer 조회(컨테이너 ID 고정·이름 표시)
                PORTAINER_TLS_VERIFY: "0"
                SOTERIA_TARGETS_FILE: /실행폴더/soteria_targets.json
                SOTERIA_ENDPOINT_ID: "3"
                SOTERIA_RECORD: /실행폴더/soteria_runs.jsonl
            - type: command
              command: python3 -X utf8 /절대경로/tool_input_transform_direct_backup_guard.py
              timeout: 30
              on_error: block
              env:
                AGENT_ENV_FILE: /실행폴더/agent.env # 훅은 --env-from-file 값을 받지 못한다
                PORTAINER_TLS_VERIFY: "0" # Portainer가 정식 인증서면 이 줄을 지운다

        # 스택 도구 검사(10/31) — Compose 위험 설정 거부. PyYAML 필요, 없으면 생성이 모두 거부된다
      #   11/6: 같은 이름 생성 거부, 스택 수정(StackUpdate)·파일 보기(StackFileInspect) 검사, 켜기·끄기 대상 확인
        - matcher: "StackCreateDockerStandaloneString"
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_input_transform_stack_guard.py
              timeout: 15
              on_error: block
              env:
                AGENT_ENV_FILE: /실행폴더/agent.env # 11/6: 같은 이름·대상 스택을 Portainer에 물어 확인
                PORTAINER_TLS_VERIFY: "0"
        - matcher: "StackStart"
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_input_transform_stack_guard.py
              timeout: 15
              on_error: block
              env:
                AGENT_ENV_FILE: /실행폴더/agent.env # 11/6: 같은 이름·대상 스택을 Portainer에 물어 확인
                PORTAINER_TLS_VERIFY: "0"
        - matcher: "StackStop"
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_input_transform_stack_guard.py
              timeout: 15
              on_error: block
              env:
                AGENT_ENV_FILE: /실행폴더/agent.env # 11/6: 같은 이름·대상 스택을 Portainer에 물어 확인
                PORTAINER_TLS_VERIFY: "0"
        - matcher: "StackFileInspect" # 11/6
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_input_transform_stack_guard.py
              timeout: 15
              on_error: block
              env:
                AGENT_ENV_FILE: /실행폴더/agent.env # 11/6: 같은 이름·대상 스택을 Portainer에 물어 확인
                PORTAINER_TLS_VERIFY: "0"
        - matcher: "StackUpdate" # 11/6 — 정책표 5.7 조건 검사. 11/12: 데이터가 있는 앱은 최근 30분 안 백업이 있어야 통과(SOTERIA_GATE)
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_input_transform_stack_guard.py
              timeout: 15
              on_error: block
              env:
                AGENT_ENV_FILE: /실행폴더/agent.env # 11/6: 같은 이름·대상 스택을 Portainer에 물어 확인
                PORTAINER_TLS_VERIFY: "0"
                SOTERIA_GATE: "1"
                SOTERIA_TARGETS_FILE: /실행폴더/soteria_targets.json
                SOTERIA_ENDPOINT_ID: "3"
                SOTERIA_RECORD: /실행폴더/soteria_runs.jsonl
        - matcher: "StackDelete" # 11/13 — 정책표 수정본 5.10: 관리 스택·external 거부, 볼륨까지 지우면 볼륨마다 최근 백업
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_input_transform_stack_guard.py
              timeout: 150
              on_error: block
              env:
                AGENT_ENV_FILE: /실행폴더/agent.env
                PORTAINER_TLS_VERIFY: "0"
                SOTERIA_TARGETS_FILE: /실행폴더/soteria_targets.json
                SOTERIA_ENDPOINT_ID: "3"
                SOTERIA_RECORD: /실행폴더/soteria_runs.jsonl
        # 11/12 soteria 백업 검사 — 켜진 앱 거부, 앱 단위 source만, job_id·archive는 훅이 정함, 그 밖의 인자 거부
        - matcher: "backup_volume"
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_input_transform_soteria_guard.py
              timeout: 150
              on_error: block
              env:
                AGENT_ENV_FILE: /실행폴더/agent.env
                PORTAINER_TLS_VERIFY: "0"
                SOTERIA_TARGETS_FILE: /실행폴더/soteria_targets.json
                SOTERIA_ENDPOINT_ID: "3"
                SOTERIA_RECORD: /실행폴더/soteria_runs.jsonl
        - matcher: "backup_status"
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_input_transform_soteria_guard.py
              timeout: 15
              on_error: block
              env:
                AGENT_ENV_FILE: /실행폴더/agent.env
                PORTAINER_TLS_VERIFY: "0"
                SOTERIA_TARGETS_FILE: /실행폴더/soteria_targets.json
                SOTERIA_ENDPOINT_ID: "3"
                SOTERIA_RECORD: /실행폴더/soteria_runs.jsonl

      # 이어서 하기(11/7) — 대화 시작 때 지금 있는 앱(스택·컨테이너·볼륨·백업 연결) 요약을 넣는다. 조회만 하고, 실패하면 아무것도 넣지 않는다
      #   공식 문서: session_start의 additional_context는 그 대화가 끝날 때까지 유지된다. 비밀값 가리기·인젝션 검사를 거친다
      session_start:
        - type: command
          command: python3 -X utf8 /절대경로/session_start_app_summary.py
          timeout: 15
          env:
            AGENT_ENV_FILE: /실행폴더/agent.env
            PORTAINER_TLS_VERIFY: "0"

      # 사용자 입력 인젝션 방어 — 입력 경로 3가지 모두 등록(일반·steer·followup)
      user_prompt_submit:
        - type: command
          command: python3 -X utf8 /절대경로/user_prompt_submit_injection_guard.py
          timeout: 10
      user_steering_messages_submit:
        - type: command
          command: python3 -X utf8 /절대경로/user_prompt_submit_injection_guard.py
          timeout: 10
      user_followup_submit:
        - type: command
          command: python3 -X utf8 /절대경로/user_prompt_submit_injection_guard.py
          timeout: 10

      # 차단된 입력은 세션에 남으므로, 모델 호출 직전에 대화에서 가린다(세션 기록은 그대로)
      before_llm_call:
        - type: command
          command: python3 -X utf8 /절대경로/before_llm_call_injection_sanitizer.py
          timeout: 10
          on_error: block

      # 도구 결과 인젝션 방어 — 의심 패턴이면 원문 뒤에 경고를 덧붙인다
      tool_response_transform:
        # 비밀값 가리기(10/31) — 인젝션 검사보다 먼저. 실패하면 원문이 그대로 간다(이 훅 종류는 차단 불가)
        # 11/12: exec "지금 백업" 실행 훅은 뺐다(soteria로 바꿈, 파일은 _backups/ai-agent-hooks/retired-1112-exec-backup)
        - matcher: "docker_proxy"
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_response_transform_secret_mask.py
              timeout: 10
              on_error: warn
        # 11/12 soteria: 성공한 백업 기록(스택 수정 전 확인용)
        - matcher: "backup_volume"
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_response_transform_soteria_record.py
              timeout: 10
              on_error: warn
              env:
                SOTERIA_TARGETS_FILE: /실행폴더/soteria_targets.json
                SOTERIA_ENDPOINT_ID: "3"
                SOTERIA_RECORD: /실행폴더/soteria_runs.jsonl
        # 11/12 soteria: 앱을 만들거나 고친 뒤 데이터 볼륨을 백업 대상에 자동으로 넣는다(창구 스택 다시 배포)
        - matcher: "StackCreateDockerStandaloneString"
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_response_transform_soteria_sync.py
              timeout: 150
              on_error: warn
              env:
                AGENT_ENV_FILE: /실행폴더/agent.env
                PORTAINER_TLS_VERIFY: "0"
                SOTERIA_TARGETS_FILE: /실행폴더/soteria_targets.json
                SOTERIA_ENDPOINT_ID: "3"
                SOTERIA_RECORD: /실행폴더/soteria_runs.jsonl
        - matcher: "StackUpdate"
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_response_transform_soteria_sync.py
              timeout: 150
              on_error: warn
              env:
                AGENT_ENV_FILE: /실행폴더/agent.env
                PORTAINER_TLS_VERIFY: "0"
                SOTERIA_TARGETS_FILE: /실행폴더/soteria_targets.json
                SOTERIA_ENDPOINT_ID: "3"
                SOTERIA_RECORD: /실행폴더/soteria_runs.jsonl
        - matcher: "StackDelete" # 11/13: 지운 앱을 백업 대상에서 뺀다
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_response_transform_soteria_sync.py
              timeout: 150
              on_error: warn
              env:
                AGENT_ENV_FILE: /실행폴더/agent.env
                PORTAINER_TLS_VERIFY: "0"
                SOTERIA_TARGETS_FILE: /실행폴더/soteria_targets.json
                SOTERIA_ENDPOINT_ID: "3"
                SOTERIA_RECORD: /실행폴더/soteria_runs.jsonl
        - matcher: "StackFileInspect" # 11/6: 스택 Compose 안의 비밀번호 가리기
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_response_transform_secret_mask.py
              timeout: 10
              on_error: warn
        - matcher: "*"
          hooks:
            - type: command
              command: python3 -X utf8 /절대경로/tool_response_transform_injection_guard.py
              timeout: 10
              on_error: warn
