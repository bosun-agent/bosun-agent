# BOSUN 전체 스택 — 웹(화면+백엔드+Agent).
#
#   cp container/.env.example container/.env    # 값 채우기(모델 키 등)
#   docker compose up -d --build
#   → 브라우저(http://127.0.0.1:3001) 첫 화면이 설정 페이지다. 거기서 Portainer 주소·API 키를 넣는다.
#
# 화면  http://127.0.0.1:3001  (웹에는 로그인이 없어 루프백으로만 발행한다 → 다른 PC에서는 SSH 터널로 접속)
#
# Portainer는 **따로 있는 것을 그대로 쓴다**(기본). 그 Portainer 주소·API 키는 설정 페이지에서 넣는다.
# 이 스택에 Portainer를 함께 띄우고 싶을 때만 프로필을 켠다:
#   docker compose --profile portainer up -d
#   (기본 `docker compose up -d`에서는 아래 portainer 서비스가 뜨지 않는다. 9443을 이미 쓰는
#    Portainer가 있으면 포트가 충돌하므로 기본에서 뺐다.)
#
# 설계 메모: 웹·Agent 컨테이너는 도커 소켓을 쓰지 않는다(도커 조작은 Portainer 경유).
# 소켓을 가진 컨테이너는 Portainer 하나뿐이고, 그 소켓 때문에 Portainer만 호스트 권한을 갖는다.
name: bosun

services:
  # ── 선택: Portainer를 이 스택에 함께 띄운다 (기본은 꺼짐) ───────────────────────
  # 이미 Portainer를 쓰고 있으면 이 서비스를 쓰지 않는다. 켜려면 --profile portainer.
  portainer:
    image: portainer/portainer-ce:2.45.1          # 팀 고정 버전(portainer/portainer-compose.yaml과 동일)
    container_name: bosun-portainer
    profiles: ["portainer"]
    restart: unless-stopped
    ports:
      - "9443:9443"                               # UI(HTTPS). 팀 기본 compose와 같이 모든 인터페이스에 발행한다(로그인 있음)
    # 초기 설정 자동화: Portainer는 미초기화 인스턴스를 아무나 차지하지 못하도록 setup token을 요구한다
    #   (POST /api/users/admin/init 에 X-Setup-Token 헤더가 없으면 403). 토큰은 기동 로그에
    #   `setup_token=...` 로 찍힌다(api/http/security/setuptoken). 여기서는 게이트를 끄고 진행한다.
    #   게이트를 켜 두려면 이 command를 지우고, 로그에서 토큰을 복사해 .env의 PORTAINER_SETUP_TOKEN에
    #   넣으면 bootstrap이 그 값을 헤더로 보낸다. UI에 9443을 루프백으로만 발행하므로 노출은 호스트로 제한된다.
    command: ["--no-setup-token"]
    # 주의(11-12 확인): Portainer는 첫 기동 후 **5분 안에** 관리자 계정이 없으면 API도 막는다
    #   (303 Redirect-Reason: AdminInitTimeout). 그래서 스택을 올린 뒤 5분 안에 bootstrap을 돌리거나,
    #   놓쳤으면 `docker compose restart portainer` 로 창을 다시 연 뒤 곧바로 실행해야 한다.
    #   관리자를 미리 만들려면 --admin-password-file(평문 파일) 또는 --admin-password(bcrypt)를 쓴다.
    # healthcheck를 두지 않는다(11-12 첫 실행에서 확인):
    #   이 이미지에 wget/curl이 없거나 9000이 막혀 있으면 컨테이너가 unhealthy로 굳고,
    #   depends_on: service_healthy 때문에 bosun이 아예 시작되지 않는다.
    #   기동 대기는 portainer-bootstrap.sh가 재시도(--retry-connrefused)로 처리한다.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - bosun_portainer_data:/data

  bosun:
    build:
      context: .
      dockerfile: container/Dockerfile
      args:
        DOCKER_AGENT_VERSION: "1.148.0"           # 팀 고정 버전(README-agent.md)
        MCP_PORTAINER_VERSION: "2.45.1"
    image: bosun-web:local
    container_name: bosun
    restart: unless-stopped
    env_file:
      - container/.env
    environment:
      HOST: 0.0.0.0                # 컨테이너 안에서만. 밖으로는 아래 ports가 127.0.0.1로만 연다
      HOST_IN_CONTAINER: "1"
      PORT: "3001"
      BOSUN_HOME: /opt/bosun
      # WEB 백엔드가 docker-agent를 자식 프로세스로 띄우고 관리한다(server/agentProcess.ts)
      AGENT_BIN: /usr/local/bin/docker-agent
      AGENT_ENV_FILE: /opt/bosun/agent.env
      AGENT_NAME: agent
      AGENT_URL: http://127.0.0.1:8080
      # Portainer 주소 두 개는 container/.env에서 온다(env_file). 기본값은 .env.example에 있다.
      #   PORTAINER_URL           화면의 "Portainer 열기" 링크(브라우저가 여는 주소)
      #   PORTAINER_URL_INTERNAL  Agent·정책 훅이 붙는 주소
    ports:
      - "127.0.0.1:3001:3001"      # 웹에는 로그인이 없다 → 루프백으로만 발행한다(다른 PC는 SSH 터널)
    volumes:
      - bosun_data:/opt/bosun       # agent.env · agent.yaml · session.db · backups.sqlite3
      - bosun_web_data:/data        # web.db(승인·차단 기록, 설정)

  # ── 선택: 볼륨 백업 ────────────────────────────────────────────────────────────
  # 앱이 생긴 뒤에만 만들 수 있다(볼륨 이름이 필요하다). 두 가지 방법:
  #   1) Agent 에게 앱과 함께 백업 스택을 만들게 한다(현재 정책 흐름, 권장)
  #   2) backup/bosun-backup-compose.yaml 을 복사해 볼륨 이름을 채우고 별도 스택으로 올린다
  # 예시(볼륨 이름은 실제 앱 볼륨으로 바꾼다):
  #
  #  backup:
  #    image: offen/docker-volume-backup:v2.50.1
  #    container_name: bosun-backup
  #    restart: unless-stopped
  #    environment:
  #      BACKUP_CRON_EXPRESSION: "0 12,18,23 * * *"
  #      TZ: Asia/Seoul
  #      BACKUP_RETENTION_DAYS: "7"
  #      BACKUP_FILENAME: "backup-%Y-%m-%dT%H-%M-%S.tar.gz"
  #    volumes:
  #      - <앱 볼륨>:/backup/<앱 볼륨>:ro
  #      - bosun_backups:/archive

  # ── 선택: soteria 백업 게이트(승인 트리거 백업 API) ────────────────────────────
  # 삭제 전에 "검증된 아카이브"를 받아 두고 싶을 때만. MCP 도구 등록은 ai-agent-hooks/agent.yaml.example 참고.
  #
  #  backup-api:
  #    image: ghcr.io/<owner>/soteria:latest
  #    entrypoint: ["/usr/bin/backup"]
  #    command: ["serve", "-http-addr", ":8080"]
  #    ports: ["127.0.0.1:18081:8080"]
  #    volumes:
  #      - <앱 볼륨>:/backup/target:ro
  #      - bosun_backups:/archive

volumes:
  bosun_portainer_data:
    # 자기 이름을 쓴다(11-12 첫 실행에서 확인): 다른 프로젝트가 만든 portainer_data가 이미 있으면
    # compose가 "was created for project ..." 경고를 내고, 그 볼륨에 관리자 계정이 남아 있으면
    # 최초 설정(portainer-bootstrap)이 로그인 단계에서 막힌다. 기존 볼륨은 건드리지 않는다.
    name: bosun_portainer_data
  bosun_data:
  bosun_web_data:
  # bosun_backups:               # 백업을 켤 때 주석 해제
