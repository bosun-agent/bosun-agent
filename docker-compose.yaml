# BOSUN 전체 스택 — 웹(화면+백엔드+Agent). Portainer는 이 스택에 넣지 않는다.
#
#   docker compose up -d --build
#   → 브라우저(http://127.0.0.1:3001) 첫 화면이 설정 페이지다. 거기서 키 두 개를 넣는다.
#   (Portainer가 다른 PC에 있으면 먼저 cp container/.env.example container/.env 하고 주소를 고친다)
#
# 화면  http://127.0.0.1:3001  (웹에는 로그인이 없어 루프백으로만 발행한다 → 다른 PC에서는 SSH 터널로 접속)
#
# Portainer는 **사용자가 따로 설치한다**(이 스택 밖). 팀 기본 compose: portainer/portainer-compose.yaml
#   cd portainer && docker compose -f portainer-compose.yaml up -d
# 이 스택에는 넣지 않는다: 9443을 쓰는 Portainer와 포트가 충돌하고, 초기 설정(관리자·API 키)은
# 사용자가 그 화면에서 하는 일이기 때문이다. 주소와 API 키는 첫 접속 설정 페이지에서 넣는다.
#
# 설계 메모: 웹·Agent 컨테이너는 도커 소켓을 쓰지 않는다(도커 조작은 Portainer 경유).
# 소켓을 가진 컨테이너는 Portainer 하나뿐이고, 그 소켓 때문에 Portainer만 호스트 권한을 갖는다.
name: bosun

services:
  bosun:
    build:
      context: .
      dockerfile: container/Dockerfile
      args:
        DOCKER_AGENT_VERSION: "1.148.0"           # 팀 고정 버전(README-agent.md)
        MCP_PORTAINER_VERSION: "2.45.1"
        SOTERIA_REF: fix/gate-request-hardening  # mcp-soteria를 빌드할 soteria 브랜치(11/15). main에 합쳐지면 main
    image: bosun-web:local
    container_name: bosun
    restart: unless-stopped        # 서버 재부팅·오류 뒤 다시 켠다(Docker 자체가 부팅 때 켜지도록 설정되어 있어야 한다)
    env_file:
      - path: container/.env       # 없어도 된다(기본값은 이미지에 있다). Portainer가 다른 PC에 있을 때만 만든다
        required: false
    environment:
      HOST: 0.0.0.0                # 컨테이너 안에서만. 밖으로는 아래 ports가 127.0.0.1로만 연다
      HOST_IN_CONTAINER: "1"
      PORT: "3001"
      BOSUN_HOME: /opt/bosun
      # WEB 백엔드가 docker-agent를 자식 프로세스로 띄우고 관리한다(server/agentProcess.ts)
      AGENT_BIN: /usr/local/bin/docker-agent
      AGENT_ENV_FILE: /opt/bosun/agent.env
      AGENT_NAME: agent
      AGENT_URL: http://127.0.0.1:8080
      # Portainer 주소 두 개의 기본값은 이미지(container/Dockerfile)에 있고, container/.env에 적으면 그 값을 쓴다.
      #   PORTAINER_URL           화면의 "Portainer 열기" 링크(브라우저가 여는 주소)
      #   PORTAINER_URL_INTERNAL  Agent·정책 훅이 붙는 주소
      # soteria 창구 주소·네트워크(SOTERIA_API=http://bosun-soteria:8080, SOTERIA_NETWORK=bosun_default)도 기본값이 이미지에 있다.
      # 이 스택 이름(name: bosun)을 바꾸면 네트워크 이름도 바뀌므로 container/.env에 SOTERIA_NETWORK=<이름>_default를 적는다.
    ports:
      - "127.0.0.1:3001:3001"      # 웹에는 로그인이 없다 → 루프백으로만 발행한다(다른 PC는 SSH 터널)
    volumes:
      - bosun_data:/opt/bosun       # agent.env · agent.yaml · session.db · backups.sqlite3
      - bosun_web_data:/data        # web.db(승인·차단 기록, 설정)

  # 백업 두 가지(soteria 창구 bosun-soteria, 정시 백업 bosun-backup)는 이 파일에 넣지 않는다.
  # 둘 다 Portainer 스택으로 두어야 훅이 새 앱 볼륨을 넣고 다시 배포할 수 있다. 처음 한 번 할 일은 container/README.md 7절.

volumes:
  bosun_data:
  bosun_web_data:
